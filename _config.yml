# Site settings
title: Sebastian Plattner
description: >-
  Cloud Native & Kubernetes engineer building open source home automation.
  Creator of OpenZEV.
tagline: Cloud Native · Kubernetes · Home Automation
url: "https://www.sebastianplattner.ch"
baseurl: ""
permalink: /blog/:title/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

# Author / social
github_username: splattner
linkedin_url: https://www.linkedin.com/in/sebastian-plattner-4a4653bb
sponsors_url: https://github.com/sponsors/splattner
coffee_url: https://buymeacoffee.com/sebastian.plattner

# Build settings
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Only these files/dirs are needed for the built site
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor

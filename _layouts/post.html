---
layout: default
---
<article class="section section--white post">
  <div class="post-header">
    <h1>{{ page.title }}</h1>
    <p class="post-meta">
      {{ page.date | date: "%B %-d, %Y" }}
      {% if page.tags %}
        {% for tag in page.tags %}<span class="post-tag">{{ tag }}</span>{% endfor %}
      {% endif %}
    </p>
  </div>
  <div class="post-content">
    {{ content }}
  </div>
  <p class="post-back"><a href="{{ "/blog/" | relative_url }}">&larr; Back to all posts</a></p>
</article>
